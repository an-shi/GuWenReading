[project]
name = "guwenreading-backend"
version = "0.1.0"
description = "古文阅读器后端：古籍阅读、文言文翻译与历史知识服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "structlog>=24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "charset-normalizer>=3.3",
    "opencc-python-reimplemented>=0.1.7",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "reportlab>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
