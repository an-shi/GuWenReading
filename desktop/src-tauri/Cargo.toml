[package]
name = "guwenreading"
version = "0.1.0"
description = "古文阅读器桌面客户端"
authors = ["古文阅读器"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "guwenreading_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
